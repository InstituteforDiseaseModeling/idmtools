name: Generate Table of Contents in Markdown

on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - '**.md'
      - '!docs/**'
      - '!.github/**'

permissions:
  contents: write

jobs:
  generateTOC:
    name: TOC Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install doctoc
        run: npm install -g doctoc

      - name: Run doctoc on all markdown files
        run: |
          find . -name "*.md" \
            -not -path "./docs/*" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -name "CHANGELOG.md" \
            | xargs doctoc --github --notitle

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No TOC changes to commit."
          else
            git commit -m "chore: auto-update table of contents"
            git push
          fi