[COMMON]
# Maxium number of workers processing in parallel
max_workers = 16

# Maxium batch size to retrieve simulations
batch_size = 20

# Validate platform type in idmtools.ini:
# {'COMPS', 'CONTAINER', 'FILE', 'PROCESS', 'SLURM', 'SSMT', 'TEST', 'TESTEXECUTE'}

[Local]
type = Local


[Test]
type = Test


[BADTYPE]
type = Bad


[NOTYPE]


[SLURM_TEST]
type = Slurm

;
;[Logging]
;level = DEBUG
;console = on